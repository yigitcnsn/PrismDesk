# Local camera calibration + capture defaults for PrismDesk alpha.
# Copy to config/camera.yaml and adjust after calibrate-camera.
# config/camera.yaml is gitignored.

# V4L2 device indices to try (USB enumeration can swap on boot)
device_indices: [1, 0, 2]

width: 1920
height: 1080
fps: 50
# FourCC: MJPG uses camera ISP (solid 1080p50 on cheap USB cams; avoid 60)
fourcc: MJPG

# Drop/recover
max_consecutive_bad_frames: 8
reopen_sleep_sec: 0.35
read_timeout_retries: 3

# Fisheye / pinhole model: "fisheye" or "pinhole"
model: fisheye
# Filled by calibrate-camera (empty = skip undistort)
camera_matrix: null
dist_coeffs: null
image_size: null  # [width, height] at calib time
