# Physical mat size (black mousepad)
width_cm: 40.0
height_cm: 30.0

# Warped output resolution: pixels per centimetre on the mat plane
# Keep this high enough for sharp object edges (source photos are ~4K).
# 40 cm * 40 = 1600 px, 30 cm * 40 = 1200 px
px_per_cm: 40.0

# Dark-region detection (HSV Value channel, 0–255); detector also sweeps nearby values
v_max: 70
# Minimum contour area as a fraction of full image area
min_area_ratio: 0.02
max_area_ratio: 0.85
# Soft image-space aspect gate (perspective foreshortening can inflate this)
aspect_tolerance: 0.55
# Morphology kernel size (odd int)
morph_kernel: 7
# Max image dimension used during detection (speed)
detect_max_dim: 1280

# --- Object auto-find on warped mat ---
# Ignore pixels this close to the mat border (avoids edge glare)
# ~1 cm at 40 px/cm
object_border_margin_px: 40
# Object area as fraction of warped mat area
object_min_area_ratio: 0.002
object_max_area_ratio: 0.55
# approxPolyDP epsilon as fraction of perimeter
object_approx_epsilon: 0.02
# Color-distance sensitivity floor (Lab MAD units * 10 scale knobs)
object_v_min: 35
