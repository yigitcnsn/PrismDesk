# Local audio capture for desk control-panel mic meter.
# Copy to config/audio.yaml (gitignored) if you need a non-default device.

# null = system default input (often the USB camera mic on Pi)
device: null
sample_rate: 16000
block_size: 1024
channels: 1
# EMA smoothing 0..1 (higher = snappier)
ema: 0.35
